services: 
  db: 
    image: postgres:16-alpine 
    environment: 
      POSTGRES_DB: fur_missile 
      POSTGRES_USER: fur_user 
      POSTGRES_PASSWORD: development_password 
    ports: 
      - "5432:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U fur_user -d fur_missile"] 
      interval: 5s 
      timeout: 5s 
      retries: 10 

volumes: 
  postgres_data: 
